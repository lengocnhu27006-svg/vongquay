<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎡 Vòng Quay Hụi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <h1>🎡 Vòng Quay Hụi</h1>
    <p>Nguyễn Hằng Ni</p>
  </header>

  <!-- TẠO / VÀO PHÒNG -->
  <section class="card room-box">

    <h2>🏠 Phòng</h2>

    <div class="row">
      <button id="createRoomBtn" class="primary">
        ➕ Tạo phòng
      </button>

      <input
        id="roomCodeInput"
        placeholder="Nhập mã phòng"
      >

      <button id="joinRoomBtn">
        🚪 Vào phòng
      </button>
    </div>

    <div id="roomInfo" class="room-info hidden">
      <b>Mã phòng:</b>
      <span id="roomCodeText"></span>

      <button id="copyRoomBtn">
        📋 Copy link
      </button>
    </div>

  </section>


  <!-- CHỌN DÂY -->
  <section class="card">

    <div class="section-title">
      <h2>🪢 Dây hụi</h2>

      <button id="addHuiBtn" class="host-only hidden">
        ➕ Thêm dây
      </button>
    </div>

    <div id="huiList" class="hui-list"></div>

  </section>


  <!-- VÒNG QUAY -->
  <section class="card wheel-card">

    <h2 id="currentHuiTitle">Chưa chọn dây</h2>

    <div class="wheel-container">

      <canvas
        id="wheel"
        width="500"
        height="500">
      </canvas>

      <div class="pointer">▼</div>

    </div>

    <button
      id="spinBtn"
      class="spin-btn host-only hidden">
      🎡 QUAY
    </button>

    <div id="result" class="result">
      Chưa có kết quả
    </div>

  </section>


  <!-- DANH SÁCH -->
  <section class="card">

    <div class="section-title">

      <h2>👥 Người tham gia</h2>

      <button
        id="addPersonBtn"
        class="host-only hidden">
        ➕ Thêm người
      </button>

    </div>

    <div id="peopleList"></div>

  </section>


  <!-- LỊCH SỬ -->
  <section class="card">

    <div class="section-title">
      <h2>📜 Lịch sử quay</h2>

      <button
        id="resetBtn"
        class="danger host-only hidden">
        🔄 Reset dây
      </button>
    </div>

    <div id="history"></div>

  </section>

</div>


<!-- MODAL THÊM DÂY -->
<div id="huiModal" class="modal hidden">

  <div class="modal-content">

    <h2>➕ Thêm dây hụi</h2>

    <input
      id="huiNameInput"
      placeholder="Ví dụ: Hụi 5tr">

    <input
      id="huiAmountInput"
      type="number"
      placeholder="Số tiền">

    <div class="modal-buttons">

      <button id="cancelHuiBtn">
        Hủy
      </button>

      <button id="saveHuiBtn" class="primary">
        Lưu
      </button>

    </div>

  </div>

</div>


<!-- MODAL THÊM NGƯỜI -->
<div id="personModal" class="modal hidden">

  <div class="modal-content">

    <h2>👤 Thêm người</h2>

    <input
      id="personNameInput"
      placeholder="Tên người tham gia">

    <div class="modal-buttons">

      <button id="cancelPersonBtn">
        Hủy
      </button>

      <button id="savePersonBtn" class="primary">
        Thêm
      </button>

    </div>

  </div>

</div>


<div id="toast"></div>


<script src="app.js"></script>

</body>
</html>
